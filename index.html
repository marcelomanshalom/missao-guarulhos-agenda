<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Guarulhos - Adoração Ininterrupta</title>
    
    <!-- Firebase SDK (Google Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --border: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --vigilia-bg: #fef2f2;
            --vigilia-text: #991b1b;
            --locked-bg: #e2e8f0;
            --locked-text: #94a3b8;
            --disabled-cell-bg: #f1f5f9;
            --disabled-cell-text: #94a3b8;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-main);
            margin: 0;
            font-weight: 800;
        }

        /* Navegação por Meses */
        .months-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            justify-content: center;
            scrollbar-width: thin;
        }

        .month-btn {
            background-color: #f1f5f9;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .month-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .month-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .month-btn:disabled {
            background-color: var(--locked-bg);
            color: var(--locked-text);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .month-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .month-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Contêiner com rolagem sincronizada para congelar cabeçalho e coluna */
        .table-responsive {
            width: 100%;
            height: 70vh;
            max-height: 600px;
            overflow: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 10px;
            background-color: white;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 13px;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background-color: white;
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        /* Congela Cabeçalho (Dias da Semana) ao rolar para baixo */
        th {
            background-color: #f8fafc !important;
            color: var(--text-main);
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Congela Coluna Lateral (Horários) ao rolar para o lado */
        .time-col {
            font-weight: 600;
            color: var(--primary);
            background-color: #f8fafc !important;
            text-align: center;
            white-space: nowrap;
            width: 130px;
            position: sticky;
            left: 0;
            z-index: 5;
            border-right: 2px solid var(--border);
        }

        /* Canto superior esquerdo (Cruzamento de Horários com o cabeçalho) - Fica travado em cima e na esquerda */
        thead th:first-child {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 20;
            background-color: #f8fafc !important;
        }

        tr.vigilia-row td {
            background-color: var(--vigilia-bg);
        }
        tr.vigilia-row .time-col {
            background-color: #fee2e2 !important;
            color: var(--vigilia-text);
        }

        .slot-cell {
            cursor: pointer;
            transition: background-color 0.15s;
            text-align: center;
            vertical-align: middle;
            min-width: 110px;
        }

        .slot-cell:hover {
            background-color: #f1f5f9;
        }

        .slot-cell.blocked-cell {
            background-color: var(--disabled-cell-bg);
            cursor: not-allowed;
            color: var(--disabled-cell-text);
            font-size: 11px;
            font-style: italic;
        }

        .slot-cell.blocked-cell:hover {
            background-color: var(--disabled-cell-bg);
        }

        .vagas-counter {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 3px;
            opacity: 0.85;
        }

        .participant-tags {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .tag {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            word-break: break-word;
        }

        .tag span {
            flex-grow: 1;
            text-align: left;
        }

        .tag button {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            padding: 0 2px;
        }

        .tag button:hover {
            color: #b91c1c;
        }

        .instructions {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Missão Guarulhos - Adoração Ininterrupta</h1>
        </header>

        <div class="instructions">
            💡 <strong>INÍCIO às 19h da segunda-feira e TÉRMINO às 19h da segunda-feira posterior.</strong><br>
            Clique em qualquer horário disponível para se inscrever. Cada usuário gerencia apenas os seus próprios agendamentos.
        </div>
        
        <!-- Navegação de Meses -->
        <div class="months-nav" id="monthsNav">
            <script>
                const meses = [
                    { id: 'jan-2026', nome: 'Janeiro de 2026', ano: 2026, mesIndex: 0 }, 
                    { id: 'fev-2026', nome: 'Fevereiro de 2026', ano: 2026, mesIndex: 1 },
                    { id: 'mar-2026', nome: 'Março de 2026', ano: 2026, mesIndex: 2 }, 
                    { id: 'abr-2026', nome: 'Abril de 2026', ano: 2026, mesIndex: 3 },
                    { id: 'mai-2026', nome: 'Maio de 2026', ano: 2026, mesIndex: 4 }, 
                    { id: 'jun-2026', nome: 'Junho de 2026', ano: 2026, mesIndex: 5 },
                    { id: 'jul-2026', nome: 'Julho de 2026', ano: 2026, mesIndex: 6 }, 
                    { id: 'ago-2026', nome: 'Agosto de 2026', ano: 2026, mesIndex: 7 },
                    { id: 'set-2026', nome: 'Setembro de 2026', ano: 2026, mesIndex: 8 }, 
                    { id: 'out-2026', nome: 'Outubro de 2026', ano: 2026, mesIndex: 9 },
                    { id: 'nov-2026', nome: 'Novembro de 2026', ano: 2026, mesIndex: 10 }, 
                    { id: 'dez-2026', nome: 'Dezembro de 2026', ano: 2026, mesIndex: 11 },
                    { id: 'jan-2027', nome: 'Janeiro de 2027', ano: 2027, mesIndex: 0 }, 
                    { id: 'fev-2027', nome: 'Fevereiro de 2027', ano: 2027, mesIndex: 1 },
                    { id: 'mar-2027', nome: 'Março de 2027', ano: 2027, mesIndex: 2 }, 
                    { id: 'abr-2027', nome: 'Abril de 2027', ano: 2027, mesIndex: 3 },
                    { id: 'mai-2027', nome: 'Maio de 2027', ano: 2027, mesIndex: 4 }, 
                    { id: 'jun-2027', nome: 'Junho de 2027', ano: 2027, mesIndex: 5 },
                    { id: 'jul-2027', nome: 'Julho de 2027', ano: 2027, mesIndex: 6 }, 
                    { id: 'ago-2027', nome: 'Agosto de 2027', ano: 2027, mesIndex: 7 },
                    { id: 'set-2027', nome: 'Setembro de 2027', ano: 2027, mesIndex: 8 }, 
                    { id: 'out-2027', nome: 'Outubro de 2027', ano: 2027, mesIndex: 9 },
                    { id: 'nov-2027', nome: 'Novembro de 2027', ano: 2027, mesIndex: 10 }, 
                    { id: 'dez-2027', nome: 'Dezembro de 2027', ano: 2027, mesIndex: 11 }
                ];

                document.write(meses.map((m, index) => `
                    <button class="month-btn ${index === 0 ? 'active' : ''}" id="btn-${m.id}" onclick="showMonth('${m.id}', this)">${m.nome.split(' ')[0]} ${m.ano}</button>
                `).join(''));
            </script>
        </div>

        <div id="contentContainer">
            <script>
                const diasSemana = [
                    "Segunda (Início 19h)", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo", "Segunda (Término 19h)"
                ];

                const horarios = [
                    { t: "02:00 as 03:00", vigilia: true }, { t: "03:00 as 04:00", vigilia: true },
                    { t: "04:00 as 05:00", vigilia: true }, { t: "05:00 as 06:00", vigilia: true },
                    { t: "06:00 as 07:00", vigilia: false }, { t: "07:00 as 08:00", vigilia: false },
                    { t: "08:00 as 09:00", vigilia: false }, { t: "09:00 as 10:00", vigilia: false },
                    { t: "10:00 as 11:00", vigilia: false }, { t: "11:00 as 12:00", vigilia: false },
                    { t: "12:00 as 13:00", vigilia: false }, { t: "13:00 as 14:00", vigilia: false },
                    { t: "14:00 as 15:00", vigilia: false }, { t: "15:00 as 16:00", vigilia: false },
                    { t: "16:00 as 17:00", vigilia: false }, { t: "17:00 as 18:00", vigilia: false },
                    { t: "18:00 as 19:00", vigilia: false }, { t: "19:00 as 20:00", vigilia: false },
                    { t: "20:00 as 21:00", vigilia: false }, { t: "21:00 as 22:00", vigilia: false },
                    { t: "22:00 as 23:00", vigilia: true }, { t: "23:00 as 00:00", vigilia: true },
                    { t: "00:00 as 01:00", vigilia: true }, { t: "01:00 as 02:00", vigilia: true }
                ];

                function isHorarioBloqueado(colIndex, horaTexto) {
                    let horaInicio = parseInt(horaTexto.split(':')[0]);

                    if (colIndex === 0) {
                        if (horaInicio >= 2 && horaInicio < 19) return true;
                    }
                    if (colIndex === 7) {
                        if (horaInicio >= 19 || (horaInicio >= 0 && horaInicio < 2)) return true;
                    }
                    return false;
                }

                document.write(meses.map((m, index) => `
                    <div id="${m.id}" class="month-section ${index === 0 ? 'active' : ''}">
                        <h2 style="font-size:18px; color:var(--primary); margin-bottom:15px;">${m.nome}</h2>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>HORÁRIO</th>
                                        ${diasSemana.map((d, cIdx) => `
                                            <th>
                                                ${d}
                                                <span class="vagas-counter" id="vagas-${m.id}-${cIdx}">... horários disponíveis</span>
                                            </th>
                                        `).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${horarios.map((h, rIdx) => `
                                        <tr class="${h.vigilia ? 'vigilia-row' : ''}">
                                            <td class="time-col">${h.t}</td>${diasSemana.map((_, cIdx) => {
                                                let bloqueado = isHorarioBloqueado(cIdx, h.t);
                                                if (bloqueado) {
                                                    return `<td class="slot-cell blocked-cell">Indisponível</td>`;
                                                } else {
                                                    return `
                                                        <td class="slot-cell" onclick="handleCellClick(event, '${m.id}', ${rIdx}, ${cIdx})">
                                                            <div class="participant-tags" id="cell-${m.id}-${rIdx}-${cIdx}"></div>
                                                        </td>
                                                    `;
                                                }
                                            }).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `).join(''));
            </script>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVe893qcka8vhZQs2bRR4JhsFB4IeUnYU",
            authDomain: "adoracao-vigilia.firebaseapp.com",
            projectId: "adoracao-vigilia",
            storageBucket: "adoracao-vigilia.firebasestorage.app",
            messagingSenderId: "87172633281",
            appId: "1:87172633281:web:cc32b0c2c70551bb1d7a40"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let meuIdUsuario = localStorage.getItem('missao_gru_userid');
        if (!meuIdUsuario) {
            meuIdUsuario = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('missao_gru_userid', meuIdUsuario);
        }

        let cacheDados = {};

        db.collection("escala_adoracao").doc("dados_completos").onSnapshot((doc) => {
            if (doc.exists) {
                cacheDados = doc.data() || {};
                renderizarDados();
            }
        });

        function renderizarDados() {
            meses.forEach(m => {
                let mesData = cacheDados[m.id] || {};
                
                let totalHorariosValidosPorColuna = {};
                let preenchidosPorColuna = {};

                diasSemana.forEach((_, cIdx) => {
                    preenchidosPorColuna[cIdx] = 0;
                    let validosCount = 0;
                    horarios.forEach(h => {
                        if (!isHorarioBloqueado(cIdx, h.t)) validosCount++;
                    });
                    totalHorariosValidosPorColuna[cIdx] = validosCount;
                });

                horarios.forEach((h, rIdx) => {
                    diasSemana.forEach((_, cIdx) => {
                        if (isHorarioBloqueado(cIdx, h.t)) return;

                        let container = document.getElementById(`cell-${m.id}-${rIdx}-${cIdx}`);
                        if (!container) return;
                        
                        container.innerHTML = '';
                        let key = `${rIdx}_${cIdx}`;
                        let itens = mesData[key] || [];

                        if (itens.length > 0) {
                            preenchidosPorColuna[cIdx]++;
                        }

                        itens.forEach(item => {
                            let tag = document.createElement('div');
                            tag.className = 'tag';

                            let span = document.createElement('span');
                            span.innerText = item.texto;

                            tag.appendChild(span);

                            if (item.autor === meuIdUsuario) {
                                let btnRemover = document.createElement('button');
                                btnRemover.innerText = '×';
                                btnRemover.title = 'Remover meu agendamento';
                                btnRemover.onclick = function(e) {
                                    e.stopPropagation();
                                    removerItem(m.id, rIdx, cIdx, item.id);
                                };
                                tag.appendChild(btnRemover);
                            }

                            container.appendChild(tag);
                        });
                    });
                });

                diasSemana.forEach((_, cIdx) => {
                    let spanVagas = document.getElementById(`vagas-${m.id}-${cIdx}`);
                    if (spanVagas) {
                        let totalValidos = totalHorariosValidosPorColuna[cIdx];
                        let preenchidos = preenchidosPorColuna[cIdx];
                        let disponiveis = totalValidos - preenchidos;
                        if (disponiveis < 0) disponiveis = 0;

                        spanVagas.innerText = `${disponiveis} horári${disponiveis === 1 ? 'o disponível' : 'os disponíveis'}`;
                    }
                });
            });
            atualizarBloqueioMeses();
        }

        function handleCellClick(event, monthId, rIdx, cIdx) {
            if (event.target.tagName === 'BUTTON') return;

            let nome = prompt("Digite seu nome ou o da sua célula/grupo para este horário:");
            if (nome && nome.trim() !== "") {
                if (!cacheDados[monthId]) cacheDados[monthId] = {};
                let key = `${rIdx}_${cIdx}`;
                if (!cacheDados[monthId][key]) cacheDados[monthId][key] = [];

                cacheDados[monthId][key].push({
                    id: 'item_' + Math.random().toString(36).substr(2, 9),
                    texto: nome.trim(),
                    autor: meuIdUsuario
                });

                salvarNoFirebase();
            }
        }

        function removerItem(monthId, rIdx, cIdx, itemId) {
            let key = `${rIdx}_${cIdx}`;
            if (cacheDados[monthId] && cacheDados[monthId][key]) {
                cacheDados[monthId][key] = cacheDados[monthId][key].filter(item => item.id !== itemId);
                salvarNoFirebase();
            }
        }

        function salvarNoFirebase() {
            db.collection("escala_adoracao").doc("dados_completos").set(cacheDados)
              .catch((error) => {
                  console.error("Erro ao salvar no banco de dados: ", error);
                  alert("Erro ao sincronizar. Verifique a conexão.");
              });
        }

        function atualizarBloqueioMeses() {
            const agora = new Date();
            const anoAtual = agora.getFullYear();
            const mesAtual = agora.getMonth();

            meses.forEach((m) => {
                let btn = document.getElementById(`btn-${m.id}`);
                if (!btn) return;

                let liberado = (m.ano < anoAtual) || (m.ano === anoAtual && m.mesIndex <= mesAtual);
                let mesData = cacheDados[m.id] || {};
                let temPreenchimento = Object.keys(mesData).some(k => mesData[k] && mesData[k].length > 0);

                if (liberado || temPreenchimento) {
                    btn.disabled = false;
                    btn.innerText = m.nome.split(' ')[0] + ' ' + m.ano;
                } else {
                    btn.disabled = true;
                    btn.innerText = '🔒 ' + m.nome.split(' ')[0] + ' ' + m.ano;
                }
            });
        }

        function showMonth(monthId, btnElement) {
            if (btnElement.disabled) return;

            document.querySelectorAll('.month-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.month-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(monthId).classList.add('active');
            btnElement.classList.add('active');
        }

        window.onload = function() {
            atualizarBloqueioMeses();
        };
    </script>
</body>
</html>
